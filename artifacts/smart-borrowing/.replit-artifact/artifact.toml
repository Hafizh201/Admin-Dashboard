kind = "web"
previewPath = "/"
title = "Smart Borrowing System"
version = "1.0.0"
id = "artifacts/smart-borrowing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25301

[services.development]
run = "pnpm --filter @workspace/smart-borrowing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-borrowing", "run", "build" ]
publicDir = "artifacts/smart-borrowing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25301"
BASE_PATH = "/"
